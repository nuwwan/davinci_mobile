components:
  schemas:
    AdminDailyQuestionResponse:
      description: Returned when admin sets today's daily question.
      properties:
        daily_question_id:
          format: uuid
          title: Daily Question Id
          type: string
        delivered_date:
          format: date
          title: Delivered Date
          type: string
        message:
          title: Message
          type: string
        question_id:
          format: uuid
          title: Question Id
          type: string
      required:
      - daily_question_id
      - question_id
      - delivered_date
      - message
      title: AdminDailyQuestionResponse
      type: object
    AdminSubAreaResponse:
      description: Row shape for the admin dashboard sub-area table.
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        id:
          title: Id
          type: integer
        is_active:
          title: Is Active
          type: boolean
        subject_id:
          title: Subject Id
          type: integer
        subject_name:
          title: Subject Name
          type: string
        title:
          title: Title
          type: string
      required:
      - id
      - title
      - subject_id
      - subject_name
      - is_active
      - created_at
      title: AdminSubAreaResponse
      type: object
    AttemptHistoryItem:
      description: One row in the learner's attempt history list.
      properties:
        attempt_id:
          format: uuid
          title: Attempt Id
          type: string
        attempted_at:
          title: Attempted At
        correct_answer_index:
          title: Correct Answer Index
          type: integer
        is_correct:
          title: Is Correct
          type: boolean
        question_id:
          format: uuid
          title: Question Id
          type: string
        question_title:
          title: Question Title
          type: string
        score:
          anyOf:
          - type: integer
          - type: 'null'
          title: Score
        selected_option_index:
          title: Selected Option Index
          type: integer
        time_taken_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Time Taken Seconds
      required:
      - attempt_id
      - question_id
      - question_title
      - selected_option_index
      - correct_answer_index
      - is_correct
      - attempted_at
      title: AttemptHistoryItem
      type: object
    AttemptResult:
      description: Response returned immediately after an attempt is submitted.
      properties:
        attempt_id:
          format: uuid
          title: Attempt Id
          type: string
        correct_answer_index:
          title: Correct Answer Index
          type: integer
        explanation:
          anyOf:
          - {}
          - type: 'null'
          title: Explanation
        is_correct:
          title: Is Correct
          type: boolean
        question_id:
          format: uuid
          title: Question Id
          type: string
        score:
          description: Points awarded (positive) or deducted (negative/zero)
          title: Score
          type: integer
        selected_option_index:
          title: Selected Option Index
          type: integer
      required:
      - attempt_id
      - question_id
      - is_correct
      - selected_option_index
      - correct_answer_index
      - score
      title: AttemptResult
      type: object
    AttemptSubmit:
      description: Body for POST /learner/attempts.
      properties:
        question_id:
          format: uuid
          title: Question Id
          type: string
        selected_option_index:
          description: 0-based index of the chosen option
          minimum: 0.0
          title: Selected Option Index
          type: integer
      required:
      - question_id
      - selected_option_index
      title: AttemptSubmit
      type: object
    CreatorSubAreaSubscriptionResponse:
      description: Returned when a creator subscribes to or unsubscribes from a sub-area.
      properties:
        is_active:
          title: Is Active
          type: boolean
        sub_area:
          $ref: '#/components/schemas/SubAreaResponse'
        subscribed_at:
          format: date-time
          title: Subscribed At
          type: string
        subscription_id:
          format: uuid
          title: Subscription Id
          type: string
      required:
      - subscription_id
      - is_active
      - subscribed_at
      - sub_area
      title: CreatorSubAreaSubscriptionResponse
      type: object
    CreatorSubjectSubscriptionResponse:
      description: Returned when a creator subscribes to or unsubscribes from a subject.
      properties:
        is_active:
          title: Is Active
          type: boolean
        subject:
          $ref: '#/components/schemas/SubjectResponse'
        subscribed_at:
          format: date-time
          title: Subscribed At
          type: string
        subscription_id:
          format: uuid
          title: Subscription Id
          type: string
      required:
      - subscription_id
      - is_active
      - subscribed_at
      - subject
      title: CreatorSubjectSubscriptionResponse
      type: object
    CreatorSummaryResponse:
      properties:
        question_attempts:
          title: Question Attempts
          type: integer
        question_likes:
          title: Question Likes
          type: integer
        questions_count:
          title: Questions Count
          type: integer
        tags_count:
          title: Tags Count
          type: integer
      required:
      - questions_count
      - tags_count
      - question_attempts
      - question_likes
      title: CreatorSummaryResponse
      type: object
    DailyQuestionResponse:
      description: Payload returned when a learner fetches today's daily question.
      properties:
        daily_question_id:
          format: uuid
          title: Daily Question Id
          type: string
        delivered_date:
          format: date
          title: Delivered Date
          type: string
        is_answered:
          title: Is Answered
          type: boolean
        question:
          $ref: '#/components/schemas/QuestionResponse'
      required:
      - daily_question_id
      - delivered_date
      - is_answered
      - question
      title: DailyQuestionResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    LearnerProfileDetail:
      description: Fields from the LearnerProfile row (optional — may not exist yet).
      properties:
        best_streak:
          default: 0
          title: Best Streak
          type: integer
        current_streak:
          default: 0
          title: Current Streak
          type: integer
        difficulty_preference:
          default: mixed
          title: Difficulty Preference
          type: string
        notification_frequency:
          default: daily
          title: Notification Frequency
          type: string
        preferred_language:
          default: en
          title: Preferred Language
          type: string
        total_learning_minutes:
          default: 0
          title: Total Learning Minutes
          type: integer
      title: LearnerProfileDetail
      type: object
    LearnerProfilePatch:
      description: Body for PATCH /learner/me — all fields optional (partial update).
      properties:
        difficulty_preference:
          anyOf:
          - enum:
            - easy
            - medium
            - hard
            - mixed
            type: string
          - type: 'null'
          title: Difficulty Preference
        email:
          anyOf:
          - format: email
            type: string
          - type: 'null'
          title: Email
        first_name:
          anyOf:
          - type: string
          - type: 'null'
          title: First Name
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
      title: LearnerProfilePatch
      type: object
    LearnerProfileResponse:
      description: 'Full learner profile: core account + UserProfile + LearnerProfile.'
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        email:
          title: Email
          type: string
        id:
          format: uuid
          title: Id
          type: string
        is_active:
          title: Is Active
          type: boolean
        learner_profile:
          anyOf:
          - $ref: '#/components/schemas/LearnerProfileDetail'
          - type: 'null'
        profile:
          anyOf:
          - $ref: '#/components/schemas/UserProfileDetail'
          - type: 'null'
        role:
          title: Role
          type: string
      required:
      - id
      - email
      - role
      - is_active
      - created_at
      title: LearnerProfileResponse
      type: object
    LearnerProfileUpdate:
      description: Body for PUT /learner/me — all fields required (upsert).
      properties:
        difficulty_preference:
          default: mixed
          enum:
          - easy
          - medium
          - hard
          - mixed
          title: Difficulty Preference
          type: string
        email:
          format: email
          title: Email
          type: string
        first_name:
          title: First Name
          type: string
        last_name:
          title: Last Name
          type: string
      required:
      - first_name
      - last_name
      - email
      title: LearnerProfileUpdate
      type: object
    PaginatedResponse_AdminSubAreaResponse_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AdminSubAreaResponse'
          title: Items
          type: array
        page:
          title: Page
          type: integer
        page_size:
          title: Page Size
          type: integer
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      - page
      - page_size
      title: PaginatedResponse[AdminSubAreaResponse]
      type: object
    PaginatedResponse_AttemptHistoryItem_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AttemptHistoryItem'
          title: Items
          type: array
        page:
          title: Page
          type: integer
        page_size:
          title: Page Size
          type: integer
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      - page
      - page_size
      title: PaginatedResponse[AttemptHistoryItem]
      type: object
    PaginatedResponse_QuestionResponse_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/QuestionResponse'
          title: Items
          type: array
        page:
          title: Page
          type: integer
        page_size:
          title: Page Size
          type: integer
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      - page
      - page_size
      title: PaginatedResponse[QuestionResponse]
      type: object
    PaginatedResponse_RewardResponse_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/RewardResponse'
          title: Items
          type: array
        page:
          title: Page
          type: integer
        page_size:
          title: Page Size
          type: integer
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      - page
      - page_size
      title: PaginatedResponse[RewardResponse]
      type: object
    PaginatedResponse_SubAreaResponse_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SubAreaResponse'
          title: Items
          type: array
        page:
          title: Page
          type: integer
        page_size:
          title: Page Size
          type: integer
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      - page
      - page_size
      title: PaginatedResponse[SubAreaResponse]
      type: object
    PaginatedResponse_SubjectResponse_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SubjectResponse'
          title: Items
          type: array
        page:
          title: Page
          type: integer
        page_size:
          title: Page Size
          type: integer
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      - page
      - page_size
      title: PaginatedResponse[SubjectResponse]
      type: object
    PaginatedResponse_TagResponse_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/TagResponse'
          title: Items
          type: array
        page:
          title: Page
          type: integer
        page_size:
          title: Page Size
          type: integer
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      - page
      - page_size
      title: PaginatedResponse[TagResponse]
      type: object
    QuestionContent:
      properties:
        alt_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Alt Text
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
        media_type:
          default: text
          title: Media Type
          type: string
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
      title: QuestionContent
      type: object
    QuestionCreate:
      properties:
        content:
          anyOf:
          - $ref: '#/components/schemas/QuestionContent'
          - type: 'null'
        correct_answer_index:
          minimum: 0.0
          title: Correct Answer Index
          type: integer
        difficulty_level:
          maximum: 5.0
          minimum: 1.0
          title: Difficulty Level
          type: integer
        explanation:
          anyOf:
          - $ref: '#/components/schemas/QuestionExplanation'
          - type: 'null'
        options:
          items:
            $ref: '#/components/schemas/QuestionOption'
          maxItems: 10
          minItems: 2
          title: Options
          type: array
        reward_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Reward Id
        sub_area_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sub Area Id
        subject_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Subject Id
        tags:
          items:
            type: string
          title: Tags
          type: array
        title:
          maxLength: 255
          minLength: 1
          title: Title
          type: string
      required:
      - title
      - options
      - correct_answer_index
      - difficulty_level
      title: QuestionCreate
      type: object
    QuestionExplanation:
      properties:
        alt_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Alt Text
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
      title: QuestionExplanation
      type: object
    QuestionOption:
      properties:
        alt_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Alt Text
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
        index:
          maximum: 10.0
          minimum: 0.0
          title: Index
          type: integer
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
      required:
      - index
      title: QuestionOption
      type: object
    QuestionResponse:
      description: Full question, safe to send to clients (includes correct answer).
      properties:
        content:
          anyOf:
          - $ref: '#/components/schemas/QuestionContent'
          - type: 'null'
        correct_answer_index:
          title: Correct Answer Index
          type: integer
        created_at:
          format: date-time
          title: Created At
          type: string
        creator_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Creator Id
        difficulty_level:
          title: Difficulty Level
          type: integer
        explanation:
          anyOf:
          - $ref: '#/components/schemas/QuestionExplanation'
          - type: 'null'
        id:
          format: uuid
          title: Id
          type: string
        is_active:
          title: Is Active
          type: boolean
        is_verified:
          title: Is Verified
          type: boolean
        options:
          items:
            $ref: '#/components/schemas/QuestionOption'
          title: Options
          type: array
        reward_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Reward Id
        sub_area_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sub Area Id
        subject_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Subject Id
        tags:
          items:
            type: string
          title: Tags
          type: array
        title:
          title: Title
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - id
      - title
      - options
      - correct_answer_index
      - difficulty_level
      - is_verified
      - is_active
      - created_at
      - updated_at
      title: QuestionResponse
      type: object
    QuestionStats:
      description: Computed on demand from `attempts` and `question_reviews`.
      properties:
        accuracy:
          anyOf:
          - type: number
          - type: 'null'
          title: Accuracy
        average_rating:
          anyOf:
          - type: number
          - type: 'null'
          title: Average Rating
        average_time_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Average Time Seconds
        correct_attempts:
          default: 0
          title: Correct Attempts
          type: integer
        total_attempts:
          default: 0
          title: Total Attempts
          type: integer
      title: QuestionStats
      type: object
    QuestionUpdate:
      properties:
        content:
          anyOf:
          - $ref: '#/components/schemas/QuestionContent'
          - type: 'null'
        correct_answer_index:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Correct Answer Index
        difficulty_level:
          anyOf:
          - maximum: 5.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Difficulty Level
        explanation:
          anyOf:
          - $ref: '#/components/schemas/QuestionExplanation'
          - type: 'null'
        is_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
        is_verified:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Verified
        options:
          anyOf:
          - items:
              $ref: '#/components/schemas/QuestionOption'
            maxItems: 10
            minItems: 2
            type: array
          - type: 'null'
          title: Options
        reward_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Reward Id
        sub_area_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sub Area Id
        subject_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Subject Id
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
        title:
          anyOf:
          - maxLength: 255
            minLength: 1
            type: string
          - type: 'null'
          title: Title
      title: QuestionUpdate
      type: object
    RefreshRequest:
      properties:
        refresh_token:
          title: Refresh Token
          type: string
      required:
      - refresh_token
      title: RefreshRequest
      type: object
    RewardCreate:
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        negative_marks:
          default: 0
          title: Negative Marks
          type: integer
        reward_amount:
          minimum: 0.0
          title: Reward Amount
          type: integer
        title:
          maxLength: 255
          minLength: 1
          title: Title
          type: string
      required:
      - title
      - reward_amount
      title: RewardCreate
      type: object
    RewardResponse:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        creator_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Creator Id
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        id:
          format: uuid
          title: Id
          type: string
        negative_marks:
          title: Negative Marks
          type: integer
        reward_amount:
          title: Reward Amount
          type: integer
        title:
          title: Title
          type: string
      required:
      - id
      - title
      - reward_amount
      - negative_marks
      - created_at
      title: RewardResponse
      type: object
    SubAreaCreate:
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        display_order:
          default: 0
          title: Display Order
          type: integer
        is_active:
          default: true
          title: Is Active
          type: boolean
        name:
          maxLength: 100
          minLength: 1
          title: Name
          type: string
        subject_id:
          title: Subject Id
          type: integer
      required:
      - name
      - subject_id
      title: SubAreaCreate
      type: object
    SubAreaResponse:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        creator_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Creator Id
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        display_order:
          title: Display Order
          type: integer
        id:
          title: Id
          type: integer
        is_active:
          title: Is Active
          type: boolean
        name:
          title: Name
          type: string
        subject_id:
          title: Subject Id
          type: integer
      required:
      - id
      - name
      - subject_id
      - display_order
      - is_active
      - created_at
      title: SubAreaResponse
      type: object
    SubAreaSubscriptionResponse:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        end_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: End Date
        id:
          format: uuid
          title: Id
          type: string
        is_active:
          title: Is Active
          type: boolean
        start_date:
          format: date-time
          title: Start Date
          type: string
        sub_area_id:
          title: Sub Area Id
          type: integer
        user_id:
          format: uuid
          title: User Id
          type: string
      required:
      - id
      - user_id
      - sub_area_id
      - is_active
      - start_date
      - created_at
      title: SubAreaSubscriptionResponse
      type: object
    SubjectCreate:
      properties:
        description:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          title: Description
        name:
          maxLength: 100
          minLength: 1
          title: Name
          type: string
      required:
      - name
      title: SubjectCreate
      type: object
    SubjectResponse:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        creator_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Creator Id
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        id:
          title: Id
          type: integer
        name:
          title: Name
          type: string
      required:
      - id
      - name
      - created_at
      title: SubjectResponse
      type: object
    SubjectSubscriptionResponse:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        end_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: End Date
        id:
          format: uuid
          title: Id
          type: string
        is_active:
          title: Is Active
          type: boolean
        start_date:
          format: date-time
          title: Start Date
          type: string
        subject_id:
          title: Subject Id
          type: integer
        user_id:
          format: uuid
          title: User Id
          type: string
      required:
      - id
      - user_id
      - subject_id
      - is_active
      - start_date
      - created_at
      title: SubjectSubscriptionResponse
      type: object
    TagCreate:
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        name:
          maxLength: 50
          minLength: 1
          title: Name
          type: string
      required:
      - name
      title: TagCreate
      type: object
    TagResponse:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        creator_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Creator Id
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        id:
          title: Id
          type: integer
        name:
          title: Name
          type: string
        usage_count:
          title: Usage Count
          type: integer
      required:
      - id
      - name
      - usage_count
      - created_at
      title: TagResponse
      type: object
    TokenResponse:
      properties:
        access_token:
          title: Access Token
          type: string
        expires_in:
          title: Expires In
          type: integer
        refresh_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Refresh Token
        token_type:
          default: bearer
          title: Token Type
          type: string
      required:
      - access_token
      - expires_in
      title: TokenResponse
      type: object
    UserCreate:
      properties:
        email:
          format: email
          title: Email
          type: string
        first_name:
          title: First Name
          type: string
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
        password:
          title: Password
          type: string
      required:
      - first_name
      - last_name
      - email
      - password
      title: UserCreate
      type: object
    UserLogin:
      properties:
        email:
          format: email
          title: Email
          type: string
        password:
          title: Password
          type: string
      required:
      - email
      - password
      title: UserLogin
      type: object
    UserProfileDetail:
      description: Fields from the UserProfile row (optional — may not exist yet).
      properties:
        avatar_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Avatar Url
        bio:
          anyOf:
          - type: string
          - type: 'null'
          title: Bio
        first_name:
          anyOf:
          - type: string
          - type: 'null'
          title: First Name
        institution:
          anyOf:
          - type: string
          - type: 'null'
          title: Institution
        is_public_profile:
          default: false
          title: Is Public Profile
          type: boolean
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        social_links:
          anyOf:
          - type: string
          - type: 'null'
          title: Social Links
      title: UserProfileDetail
      type: object
    UserUpdate:
      properties:
        first_name:
          anyOf:
          - type: string
          - type: 'null'
          title: First Name
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
      required:
      - first_name
      - last_name
      title: UserUpdate
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/login
      type: oauth2
