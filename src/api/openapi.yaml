          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Verified
      - in: query
        name: is_active
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
      - description: Page number
        in: query
        name: page
        required: false
